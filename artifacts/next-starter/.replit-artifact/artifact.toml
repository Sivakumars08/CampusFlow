kind = "web"
previewPath = "/"
title = "CampusFlow"
description = "A multi-college campus service and grievance platform. Coming soon."
version = "1.0.0"
id = "artifacts/next-starter"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22169

[services.development]
run = "pnpm --filter @workspace/next-starter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/next-starter", "run", "build" ]
serve = "static"
publicDir = "artifacts/next-starter/out"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22169"
BASE_PATH = "/"
